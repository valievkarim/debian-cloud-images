name: Build and release Debian armhf cloud images

on:
  workflow_dispatch:  # Manual triggering only
    inputs:
      releases:
        description: 'Debian releases to build'
        required: false
        default: both
        type: choice
        options:
          - both
          - bookworm
          - trixie

permissions:
  contents: write  # Required for creating releases

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set.outputs.matrix }}
    steps:
      - id: set
        run: |
          case "${{ inputs.releases }}" in
            bookworm)
              echo 'matrix={"include":[{"release":"bookworm","version":12}]}' >> "$GITHUB_OUTPUT"
              ;;
            trixie)
              echo 'matrix={"include":[{"release":"trixie","version":13}]}' >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo 'matrix={"include":[{"release":"bookworm","version":12},{"release":"trixie","version":13}]}' >> "$GITHUB_OUTPUT"
              ;;
          esac

  build:
    needs: setup
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.setup.outputs.matrix) }}
    # Native ARM workers: armhf builds still go through the same
    # build-armhf-debian-image.sh (qemu-arm binfmt path), but running on
    # arm64 avoids full x86_64->ARM emulation. ubuntu-24.04-arm is the
    # version-pinned hosted label; there is no ubuntu-latest-arm alias.
    runs-on: ubuntu-24.04-arm
    container:
      image: debian:trixie
      options: >-
        --privileged
        -v /dev:/dev
        -v /proc:/proc
        -v /sys:/sys
        -v /run:/run

    steps:
    - name: Install git
      run: |
        apt-get update
        apt-get install -y git

    - uses: actions/checkout@v4

    - name: Build image
      run: |
        ./build-armhf-debian-image.sh "${{ matrix.release }}"
        mv "image_${{ matrix.release }}_generic_armhf.qcow2" \
          "debian-${{ matrix.version }}-generic-armhf.qcow2"
        chown $(id -u):$(id -g) debian-${{ matrix.version }}-generic-armhf.qcow2

    - uses: actions/upload-artifact@v4
      with:
        name: debian-${{ matrix.version }}-generic-armhf
        path: debian-${{ matrix.version }}-generic-armhf.qcow2
        retention-days: 1

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
    - uses: actions/download-artifact@v4
      with:
        path: artifacts
        merge-multiple: true

    - name: Get current date
      id: date
      run: echo "date=$(date +'%Y-%m-%d')" >> $GITHUB_OUTPUT

    - name: Create Release
      uses: ncipollo/release-action@v1
      with:
        tag: latest
        commit: ${{ github.sha }}
        name: daily build ${{ steps.date.outputs.date }}
        artifacts: artifacts/*.qcow2
        allowUpdates: true
        removeArtifacts: true
        token: ${{ secrets.GITHUB_TOKEN }}
        makeLatest: true
